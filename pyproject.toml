[project]
name = "misinfo-stress-test"
version = "0.1.0"
description = "An experiment to evaluate how different AI models react to misinformation, hidden propaganda, etc."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.111.0",
    "inspect-ai>=0.3.241",
    "mistralai>=2.5.0",
    "openai>=2.44.0",
    "openrouter>=0.10.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "types-pyyaml>=6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misinfo_stress_test"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
